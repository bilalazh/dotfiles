# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf




###################
###  THEME  ###
###################
# Adwaita-dark is the default theme
# this works for default apps and its just a hack i still have to fix this
env = GTK_THEME,Adwaita-dark



###################
###  IMPORTS  ###
###################

# Import Monitors Config
  source = ~/.config/hypr/monitors.conf
# Hyprland keybinds
  source = ~/.config/hypr/bindings.conf
# Autostart
  source = ~/.config/hypr/autostart.conf
# Hyprland input devices
  source = ~/.config/hypr/input.conf





#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14

# This is to fix the problems with clipboards
# env = ELECTRON_OZONE_PLATFORM_HINT,auto
# env = NIXOS_OZONE_WL,1



env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NIXOS_OZONE_WL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 0

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(79740eff)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false 
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 1
        passes = 2
        new_optimizations = true
        xray = false
        vibrancy = 0.3
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

# https://wiki.hyprland.org/Configuring/Variables/#binds
binds {
    workspace_back_and_forth = true
}


### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

#############################
### LAYER RULES (GLASS)  ###
#############################
# Enable real blur behind Waybar for liquid glass effect
# TODO: Research GPU/battery impact before enabling permanently
# - Check GPU usage with `nvtop` or `radeontop`
# - Monitor battery drain with `upower -i /org/freedesktop/UPower/devices/battery_BAT0`
# - If impact is high, reduce: blur size=6 passes=2 vibrancy=0.2 or disable

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen_state_internal 0, match:pin 0

# Loading Noeko PWA as a normal tiled window
windowrule = tile on, match:initial_title ^Noeko.*$
windowrule = tile on, match:initial_title ^Grok.*$
windowrule = tile on, match:initial_title ^WhatsApp.*$
windowrule = tile on, match:initial_title ^Pintrest.*$
windowrule = tile on, match:initial_title ^Snapchat.*$
windowrule = tile on, match:initial_title ^Figma.*$
windowrule = tile on, match:initial_title ^YouTube Music.*$
windowrule = tile on, match:initial_title ^Discord.*$



# Noeko on Workspace 6
windowrule = workspace 6, match:initial_title ^(Noeko.*)$

# Whatsapp on Workspace 7
windowrule = workspace 7, match:initial_title ^(WhatsApp.*)$

# Handy on Workspace 9
windowrule = workspace 9, match:initial_title ^(Handy.*)$

# Whispering on Workspace 9
windowrule = workspace 9, match:initial_title ^(Whispering.*)$

# Spotify on Workspace 10
windowrule = workspace 10, match:initial_title ^(Spotify.*)$



# Float the nmtui window
# Class defined in waybar/config.jsonc: "on-click": "foot --class nmtui-float -e nmtui"
windowrule {
  name = float-nmtui
  match:class = ^(nmtui-float)$
  float = on
  center = on
  size = 600 400
}


# Float the cliphist + fzf window
# Class defined in bindings.conf: bind = SUPER SHIFT, V, exec, foot --app-id cliphist-float ...
windowrule = float on, match:class ^(cliphist-float)$
windowrule = center on, match:class ^(cliphist-float)$
# Set a nice size
windowrule = size 800 600, match:class ^(cliphist-float)$





########################################################################################
# AFFINITY FOCUS REPAIR (WORKSPACE 8)
########################################################################################

# 1. Global Rule: Everything in Affinity floats on Workspace 8
########################################################################################
# AFFINITY SUITE - FINAL INTERACTIVE FIX
########################################################################################

# 1. WORKSPACE 8: The "Safe Zone"
# Forces everything here to float.
workspace = 8, floating:1

# 2. MAIN WINDOW & SPLASH SCREEN
# Allow them to exist, center them, and let them accept input.
windowrule = float on, match:class ^(affinity.exe)$
windowrule = workspace 8, match:class ^(affinity.exe)$

# 3. THE TOOLBARS (Fixing the "Unresponsive" issue)
# REMOVED 'nofocus' so you can actually click them.
# ADDED 'noinitialfocus' so they don't steal keyboard while typing.
# ADDED 'pin' so they stay visible above the canvas.

# 4. THE "HIDDEN DIALOG" FIX (Crucial for the freeze)
# This forces any popup (New Document, export, warnings) to
# immediately jump to the front and center itself so you don't get locked out.





