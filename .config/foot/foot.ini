#/:: Foot terminal config matching Kitty Gruvbox Dark Hard theme
# Geist Mono Nerd Font Mono (proper mono Nerd Font variant)
[main]
font=GeistMono Nerd Font Mono:style=SemiBold:size=9
font-bold=GeistMono Nerd Font Mono:style=SemiBold:size=9
initial-color-theme=1



[scrollback]
lines=2000

# Gruvbox Dark Hard colors (no # prefix, pre-1.26 foot uses [colors])
[colors]
background=1d2021
foreground=ebdbb2
selection-foreground=ebdbb2
selection-background=d65d0e
cursor=bdae93 665c54
# Regular ANSI colors 0-7
regular0=3c3836
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

# Bright ANSI colors 8-15
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=fbf1c7

alpha=1.0
[url]
launch=xdg-open ${url}

[tweak]
font-monospace-warn=no
